<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAF Handler Demo!</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">
    <main class="w-full max-w-lg bg-slate-900 border border-slate-800 shadow-xl rounded-xl p-6">
        <h1 class="text-3xl font-bold text-cyan-400 mb-5 text-center">RAF Loop Demo</h1>
        <div id="display" class="p-4 bg-slate-800 rounded-md border border-slate-700">
            <table class="min-w-full text-left text-sm">
                <tbody>
                    <tr class="border-b border-slate-700">
                        <td class="px-3 py-2 text-cyan-300">Frame Count</td>
                        <td class="px-3 py-2" id="raf-framecount">0</td>
                    </tr>
                    <tr class="border-b border-slate-700">
                        <td class="px-3 py-2 text-cyan-300">Time Stamp</td>
                        <td class="px-3 py-2" id="raf-timestamp">0</td>
                    </tr>
                    <tr>
                        <td class="px-3 py-2 text-cyan-300">Delta Time</td>
                        <td class="px-3 py-2" id="raf-delta">0</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div id="controls" class="mt-5 flex gap-3 justify-center">
            <button id="ctrl-stop" class="px-5 py-2 rounded-lg bg-rose-500 hover:bg-rose-400 text-slate-900 font-semibold transition">Stop</button>
            <button id="ctrl-start" class="px-5 py-2 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-semibold transition">Start</button>
        </div>
        <noscript>This page contains webassembly and javascript content, please enable javascript in your browser.</noscript>
        <script src="./bootstrap.js"></script>
</body>

</html>
